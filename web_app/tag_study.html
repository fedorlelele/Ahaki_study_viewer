<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>タグ学習ラボ | Ahaki Study Viewer</title>
    <style>
      :root {
        --bg: #f6f7f4;
        --paper: #fffdf7;
        --ink: #172223;
        --muted: #5a6668;
        --line: #d2d8d4;
        --accent: #0f6e65;
        --accent-ink: #ffffff;
        --warn: #7a2f0a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: radial-gradient(circle at 12% -5%, #e9f2eb 0%, #f6f7f4 48%, #f2f3ef 100%);
        color: var(--ink);
        font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
      }
      header {
        border-bottom: 1px solid var(--line);
        background: #fdfcf8;
      }
      .header-inner {
        max-width: 1240px;
        margin: 0 auto;
        padding: 14px 16px;
      }
      .top-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .title {
        margin: 0;
        font-size: clamp(24px, 3vw, 34px);
        letter-spacing: 0.02em;
      }
      .subtitle {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      .menu-toggle {
        min-width: 44px;
        min-height: 40px;
        font-size: 18px;
        padding: 0;
      }
      .top-panels {
        margin-top: 12px;
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }
      .top-panels[hidden] {
        display: none;
      }
      .top-links {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .top-links a {
        color: var(--accent);
        text-decoration: none;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 7px 12px;
        background: #fff;
        font-size: 13px;
      }
      .top-links a:hover {
        border-color: var(--accent);
      }
      .top-links button {
        color: var(--accent);
        border-radius: 999px;
        padding: 7px 12px;
      }
      main {
        max-width: 1240px;
        margin: 0 auto;
        padding: 18px 16px 30px;
      }
      .auth {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--paper);
        padding: 12px;
        margin-top: 10px;
      }
      .auth-top {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
      }
      .auth-status {
        font-size: 13px;
      }
      .auth-note {
        margin-top: 8px;
        color: var(--muted);
        font-size: 12px;
      }
      .auth-inputs {
        margin-top: 10px;
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: 8px;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(300px, 420px) minmax(0, 1fr);
        gap: 14px;
      }
      .panel {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--paper);
        box-shadow: 0 8px 24px rgba(22, 28, 24, 0.05);
      }
      .panel-head {
        padding: 12px;
        border-bottom: 1px solid var(--line);
      }
      .panel-body {
        padding: 12px;
      }
      h2 {
        margin: 0;
        font-size: 15px;
      }
      .hint {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }
      label {
        display: block;
        font-size: 12px;
        margin: 0 0 5px;
        color: var(--muted);
      }
      input,
      textarea,
      button {
        font: inherit;
      }
      input,
      textarea {
        width: 100%;
        border: 1px solid #c9d1cc;
        border-radius: 9px;
        padding: 9px 10px;
        background: #fff;
      }
      textarea {
        resize: vertical;
        min-height: 90px;
      }
      button {
        border: 1px solid #c1c9c4;
        border-radius: 9px;
        padding: 8px 11px;
        background: #fff;
        cursor: pointer;
      }
      button:hover {
        border-color: #91a79f;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .btn-accent {
        background: var(--accent);
        color: var(--accent-ink);
        border-color: var(--accent);
      }
      .btn-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .search-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 8px;
      }
      .search-meta {
        margin-top: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .result-list {
        margin-top: 10px;
        max-height: calc(100vh - 290px);
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
      }
      .result-list.is-compact {
        max-height: none;
      }
      .single-hit-note {
        padding: 10px 12px;
        font-size: 13px;
        line-height: 1.6;
        color: #1f463e;
        background: #eef8f5;
      }
      .result-item {
        width: 100%;
        text-align: left;
        border: 0;
        border-bottom: 1px solid #edf0ed;
        border-radius: 0;
        background: #fff;
        padding: 10px;
      }
      .result-item:last-child {
        border-bottom: 0;
      }
      .result-item.active {
        background: #e9f5f1;
      }
      .result-item-title {
        font-weight: 700;
        font-size: 14px;
      }
      .result-item-meta {
        margin-top: 4px;
        font-size: 12px;
        color: var(--muted);
      }
      .empty {
        padding: 14px;
        color: var(--muted);
        font-size: 13px;
      }
      .tag-title {
        margin: 0;
        font-size: clamp(20px, 2.2vw, 28px);
      }
      .tag-meta {
        margin-top: 7px;
        color: var(--muted);
        font-size: 12px;
      }
      .section {
        margin-top: 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
      }
      .section h3 {
        margin: 0;
        padding: 10px 11px;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
      }
      .section-body {
        padding: 11px;
      }
      .chip-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #c4cec7;
        border-radius: 999px;
        background: #f8fbf9;
        color: #21433b;
        font-size: 12px;
        padding: 5px 10px;
        text-decoration: none;
      }
      .chip-button {
        border: 1px solid #c4cec7;
        border-radius: 999px;
        background: #f8fbf9;
        color: #21433b;
        font-size: 12px;
        padding: 5px 10px;
      }
      .rank-list .rank-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .rank-no {
        font-weight: 700;
        font-size: 11px;
        color: #1b4d43;
        background: #e8f5f0;
        border-radius: 999px;
        padding: 2px 7px;
      }
      .rank-count {
        color: var(--muted);
        font-size: 11px;
      }
      .related-head {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .serial-open-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #c4cec7;
        border-radius: 999px;
        background: #ffffff;
        color: #21433b;
        font-size: 12px;
        padding: 5px 10px;
        text-decoration: none;
      }
      .expand-btn {
        margin-top: 8px;
        padding: 5px 10px;
        font-size: 12px;
      }
      .is-hidden {
        display: none !important;
      }
      .tag-description {
        line-height: 1.7;
        font-size: 14px;
      }
      .status {
        margin-top: 7px;
        font-size: 12px;
        color: var(--muted);
      }
      .status.error {
        color: var(--warn);
      }
      .qa-item {
        border: 1px solid #dde4df;
        border-radius: 9px;
        padding: 9px;
        margin-top: 8px;
      }
      .qa-q {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        background: transparent;
        padding: 0;
        margin: 0;
        font-weight: 700;
        color: #193f36;
      }
      .qa-meta {
        margin-top: 5px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .qa-answer {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px dashed #d6dfd9;
        font-size: 14px;
      }
      .qa-empty {
        color: var(--muted);
        font-size: 13px;
      }
      .loading {
        opacity: 0.75;
      }
      .markdown-body h1,
      .markdown-body h2,
      .markdown-body h3,
      .markdown-body h4 {
        margin: 1em 0 0.5em;
      }
      .markdown-body p,
      .markdown-body ul,
      .markdown-body ol {
        margin: 0.5em 0;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }
      @media (max-width: 1280px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .result-list {
          max-height: 340px;
        }
        .auth-inputs {
          grid-template-columns: 1fr;
        }
        .search-head {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <div class="top-nav">
          <div>
            <h1 class="title">タグ学習ラボ</h1>
            <div class="subtitle">タグ辞書を起点に、用語の深掘り解説とQ&Aを行う学習ページ</div>
          </div>
          <button id="menuToggleBtn" class="menu-toggle" type="button" aria-expanded="false" aria-label="メニュー">☰</button>
        </div>
        <div id="topPanels" class="top-panels" hidden>
	          <nav class="top-links" aria-label="ページ移動">
	            <a href="./index.html">高機能ビューへ</a>
	            <a href="./simple.html">かんたんビューへ</a>
	            <a href="./analytics.html">データ分析へ</a>
	            <button id="authPanelToggle" type="button">ログイン</button>
	          </nav>
          <section class="auth" id="authPanel" aria-label="ログイン状態" hidden>
            <div class="auth-top">
              <div class="auth-status" id="authStatus">ログイン状態: 未確認</div>
              <div class="btn-row">
                <button id="authRefreshBtn" type="button">状態更新</button>
                <button id="authSignOutBtn" type="button">ログアウト</button>
              </div>
            </div>
            <div class="auth-inputs">
              <input id="authEmail" type="email" autocomplete="username" placeholder="メールアドレス（管理者ログイン用）" />
              <input id="authPassword" type="password" autocomplete="current-password" placeholder="パスワード" />
              <button id="authSignInBtn" type="button" class="btn-accent">ログイン</button>
            </div>
            <div class="auth-note" id="authNote">AI公開がOFFのとき、生成機能は管理者ログインが必要です。</div>
          </section>
        </div>
      </div>
    </header>

    <main>
      <div class="layout">
        <section class="panel" aria-label="タグ検索">
          <div class="panel-head">
            <h2>タグ検索</h2>
            <div class="hint">タグ名・同義語・説明文で検索できます。例: <code>#心周期</code> / <code>十二経脈</code></div>
          </div>
          <div class="panel-body">
            <div class="search-head">
              <input id="tagSearchInput" type="text" placeholder="タグ名を入力" aria-label="タグ検索" />
              <button id="tagSearchBtn" type="button" class="btn-accent">検索</button>
              <button id="tagSearchClearBtn" type="button">クリア</button>
            </div>
            <div class="search-meta" id="searchMeta"></div>
            <div class="result-list" id="resultList" role="listbox" aria-label="タグ検索結果"></div>
          </div>
        </section>

        <section class="panel" aria-live="polite">
          <div class="panel-head">
            <h2 id="detailTitle">タグ詳細</h2>
            <div class="hint" id="detailHint">左の検索結果からタグを選択してください。</div>
          </div>
          <div class="panel-body" id="detailBody">
            <div class="empty">タグが未選択です。</div>
          </div>
        </section>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="./config.js"></script>
    <script>
      const supabaseClient =
        window.supabase && window.SUPABASE_URL && window.SUPABASE_KEY
          ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY)
          : null;

      const state = {
        tagCatalog: [],
        tagCatalogByTag: {},
        indexByTag: {},
        indexBySubject: {},
        indexBySubtopic: {},
        tagEquivalentByNormalized: {},
        selectedTag: "",
        aiPublicGeneration: false,
        authSession: null,
        roleRank: 0,
        tagDeepDiveCache: {},
        tagQaCache: {},
        tagDeepDiveRatings: {},
        qaViewed: new Set(),
        qaLiked: new Set(),
        renderSeq: 0,
        lastAnalyticsSearchKey: "",
      };

      function normalizeRole(role) {
        if (role === "admin" || role === "teacher" || role === "student") return role;
        return "";
      }

      function getUserRole(user) {
        const role = user?.app_metadata?.role || user?.user_metadata?.role || "";
        return normalizeRole(role);
      }

      function roleRank(role) {
        if (role === "admin") return 3;
        if (role === "teacher") return 2;
        if (role === "student") return 1;
        return 0;
      }

      function normalizeAscii(text) {
        return String(text || "")
          .replace(/[Ａ-Ｚａ-ｚ０-９]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
          .replace(/[‐‑‒–—―−ーｰ－]/g, "-");
      }

      function normalizeTagKey(value) {
        return normalizeAscii(String(value || "")).trim().toLowerCase();
      }

      function escapeHtmlForMarkdown(text) {
        return String(text || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function markdownToHtml(text) {
        const escaped = escapeHtmlForMarkdown(text);
        if (window.marked && typeof window.marked.parse === "function") {
          return window.marked.parse(escaped, { gfm: true, breaks: true });
        }
        return escaped.replace(/\n/g, "<br>");
      }

      function renderMarkdownToElement(target, text) {
        if (!target) return;
        target.classList.add("markdown-body");
        target.innerHTML = markdownToHtml(text);
      }

	      function parseApiError(payload, fallback) {
	        if (!payload) return fallback || "API error";
	        if (typeof payload === "string") return payload || fallback || "API error";
	        return String(payload.detail || payload.message || payload.error || fallback || "API error");
	      }

	      function createClientId(prefix = "id") {
	        if (crypto && crypto.randomUUID) {
	          return `${prefix}_${crypto.randomUUID()}`;
	        }
	        return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 10)}`;
	      }

	      function getAnonId() {
	        const key = "anonId";
	        let id = localStorage.getItem(key);
	        if (id) return id;
	        id = createClientId("anon");
	        localStorage.setItem(key, id);
	        return id;
	      }

	      function getTagDeepDiveRatingActorId() {
	        if (state.authSession && state.authSession.user && state.authSession.user.id) {
	          return `user:${state.authSession.user.id}`;
	        }
	        return `anon:${getAnonId()}`;
	      }

	      function getTagDeepDiveRatingsStorageKey() {
	        return `tagDeepDiveRatings:${getTagDeepDiveRatingActorId()}`;
	      }

	      function getTagDeepDiveRatingKey(tag) {
	        const safe = normalizeTagKey(tag);
	        if (!safe) return "";
	        return `tag:${safe}`;
	      }

	      function loadTagDeepDiveRatingState() {
	        state.tagDeepDiveRatings = {};
	        const key = getTagDeepDiveRatingsStorageKey();
	        const raw = localStorage.getItem(key);
	        if (!raw) return;
	        try {
	          const data = JSON.parse(raw);
	          if (!data || typeof data !== "object") return;
	          Object.keys(data).forEach((value) => {
	            const rating = data[value];
	            if (rating === "helpful" || rating === "not_helpful") {
	              state.tagDeepDiveRatings[value] = rating;
	            }
	          });
	        } catch (_err) {
	          localStorage.removeItem(key);
	        }
	      }

	      function saveTagDeepDiveRatingState() {
	        const key = getTagDeepDiveRatingsStorageKey();
	        localStorage.setItem(key, JSON.stringify(state.tagDeepDiveRatings || {}));
	      }

	      function getAnalyticsSessionId() {
	        const key = "analyticsSessionId";
	        let id = sessionStorage.getItem(key);
	        if (id) return id;
	        id = createClientId("sess");
	        sessionStorage.setItem(key, id);
	        return id;
	      }

	      function getAnalyticsApiBase() {
	        return window.AI_API_BASE || window.ADMIN_API_BASE || "";
	      }

	      function getAnalyticsAuthToken() {
	        if (state.authSession && state.authSession.access_token) {
	          return state.authSession.access_token;
	        }
	        return "";
	      }

	      function sendAnalyticsEvents(events, options = {}) {
	        const base = getAnalyticsApiBase();
	        if (!base) return;
	        const list = Array.isArray(events) ? events : [events];
	        const normalized = list
	          .map((item) => (item && typeof item === "object" ? item : {}))
	          .map((item) => ({
	            event_name: String(item.event_name || item.name || "").trim(),
	            occurred_at: item.occurred_at || new Date().toISOString(),
	            surface: String(item.surface || options.surface || "").trim(),
	            entity_type: String(item.entity_type || options.entity_type || "").trim(),
	            entity_id: String(item.entity_id || options.entity_id || "").trim(),
	            request_id: String(item.request_id || options.request_id || "").trim(),
	            props: item.props && typeof item.props === "object" ? item.props : {}
	          }))
	          .filter((item) => item.event_name);
	        if (!normalized.length) return;
	        const headers = { "Content-Type": "application/json" };
	        const token = getAnalyticsAuthToken();
	        if (token) headers.Authorization = `Bearer ${token}`;
	        fetch(`${base}/analytics/collect`, {
	          method: "POST",
	          headers,
	          body: JSON.stringify({
	            page: "tag_study",
	            surface: String(options.surface || "").trim(),
	            session_id: getAnalyticsSessionId(),
	            anon_id: getAnonId(),
	            events: normalized
	          }),
	          keepalive: true
	        }).catch(() => {});
	      }

	      function trackAnalyticsEvent(eventName, options = {}) {
	        const name = String(eventName || "").trim();
	        if (!name) return;
	        sendAnalyticsEvents(
	          [
	            {
	              event_name: name,
	              surface: options.surface || "",
	              entity_type: options.entity_type || "",
	              entity_id: options.entity_id || "",
	              request_id: options.request_id || "",
	              props: options.props || {}
	            }
	          ],
	          { surface: options.surface || "" }
	        );
	      }

	      async function submitAiFeedbackEvent(payload = {}) {
	        const base = getAnalyticsApiBase();
	        if (!base) return;
	        const feature = String(payload.feature || "").trim();
	        if (!feature) return;
	        const rating = payload.rating === "not_helpful" ? "not_helpful" : "helpful";
	        const headers = { "Content-Type": "application/json" };
	        const token = await getAccessToken().catch(() => "");
	        if (token) headers.Authorization = `Bearer ${token}`;
	        await fetch(`${base}/analytics/ai_feedback`, {
	          method: "POST",
	          headers,
	          body: JSON.stringify({
	            request_id: String(payload.request_id || "").trim(),
	            feature,
	            rating,
	            reason_codes: Array.isArray(payload.reason_codes) ? payload.reason_codes : [],
	            comment: String(payload.comment || "").trim(),
	            anon_id: getAnonId(),
	            session_id: getAnalyticsSessionId(),
	            entity_type: String(payload.entity_type || "").trim(),
	            entity_id: String(payload.entity_id || "").trim()
	          }),
	          keepalive: true
	        }).catch(() => {});
	      }

      function getEquivalentTagsForTerm(term) {
        const key = normalizeTagKey(term);
        if (!key) return [];
        const found = state.tagEquivalentByNormalized[key] || [];
        if (found.length) return found;
        return [String(term || "").trim()].filter(Boolean);
      }

      function buildTagEquivalentMap() {
        const mapping = {};
        const addGroup = (labels) => {
          const uniq = Array.from(
            new Set((labels || []).map((v) => String(v || "").trim()).filter(Boolean))
          );
          if (!uniq.length) return;
          const keys = Array.from(new Set(uniq.map((v) => normalizeTagKey(v)).filter(Boolean)));
          keys.forEach((key) => {
            if (!mapping[key]) mapping[key] = new Set();
            uniq.forEach((label) => mapping[key].add(label));
          });
        };

        state.tagCatalog.forEach((item) => {
          addGroup([item.tag, item.canonical_tag, ...(Array.isArray(item.aliases) ? item.aliases : [])]);
        });
        Object.keys(state.indexByTag || {}).forEach((tag) => addGroup([tag]));

        const out = {};
        Object.keys(mapping).forEach((key) => {
          out[key] = Array.from(mapping[key]).sort((a, b) => a.localeCompare(b, "ja"));
        });
        return out;
      }

      function getRelatedSerialsForTag(tag) {
        const labels = getEquivalentTagsForTerm(tag);
        const set = new Set();
        labels.forEach((label) => {
          const serials = state.indexByTag[label] || [];
          serials.forEach((serial) => set.add(serial));
        });
        return Array.from(set).sort(compareSerialNewestFirst);
      }

      function parseSerialForSort(value) {
        const raw = normalizeAscii(String(value || "")).trim().toUpperCase();
        let match = raw.match(/^([AB])(\d{2})-(\d{3})$/);
        if (match) {
          return {
            examType: match[1],
            session: Number(match[2]),
            number: Number(match[3])
          };
        }
        match = raw.match(/^([AB])(\d{1,2})-(\d{1,3})$/);
        if (match) {
          return {
            examType: match[1],
            session: Number(match[2]),
            number: Number(match[3])
          };
        }
        return null;
      }

      function compareSerialNewestFirst(a, b) {
        const pa = parseSerialForSort(a);
        const pb = parseSerialForSort(b);
        if (pa && pb) {
          if (pa.session !== pb.session) return pb.session - pa.session;
          if (pa.examType !== pb.examType) return String(pb.examType).localeCompare(String(pa.examType), "ja");
          if (pa.number !== pb.number) return pb.number - pa.number;
        }
        return String(b).localeCompare(String(a), "ja");
      }

      function scoreTagItem(item, terms) {
        const tag = String(item.tag || "");
        const canonical = String(item.canonical_tag || "");
        const aliases = Array.isArray(item.aliases) ? item.aliases.map((v) => String(v || "")) : [];
        const desc = String(item.description || "");
        const normTag = normalizeTagKey(tag);
        const normCanonical = normalizeTagKey(canonical);
        const normAliases = aliases.map((v) => normalizeTagKey(v));
        const normDesc = normalizeTagKey(desc);

        let score = 0;
        for (const term of terms) {
          const normTerm = normalizeTagKey(term.replace(/^#/, ""));
          if (!normTerm) continue;
          let matched = false;
          if (normTag === normTerm) {
            score += 120;
            matched = true;
          } else if (normCanonical === normTerm) {
            score += 110;
            matched = true;
          } else if (normAliases.some((v) => v === normTerm)) {
            score += 100;
            matched = true;
          } else if (normTag.startsWith(normTerm)) {
            score += 80;
            matched = true;
          } else if (normCanonical.startsWith(normTerm)) {
            score += 72;
            matched = true;
          } else if (normAliases.some((v) => v.startsWith(normTerm))) {
            score += 64;
            matched = true;
          } else if (normTag.includes(normTerm)) {
            score += 42;
            matched = true;
          } else if (normCanonical.includes(normTerm)) {
            score += 36;
            matched = true;
          } else if (normAliases.some((v) => v.includes(normTerm))) {
            score += 30;
            matched = true;
          } else if (normDesc.includes(normTerm)) {
            score += 16;
            matched = true;
          }
          if (!matched) return -1;
        }
        score += Math.min(30, Number(item.view_count || 0));
        score += Math.min(20, Number(item.related_count || 0) / 30);
        return score;
      }

      function getSearchTerms() {
        const input = document.getElementById("tagSearchInput");
        const text = (input ? input.value : "").trim();
        if (!text) return [];
        return text

          .map((v) => v.trim())
          .filter(Boolean);
      }

      function describeSingleHit(terms, tag) {
        const first = terms && terms.length ? terms[0] : "";
        const normalizedTerm = normalizeTagKey(String(first).replace(/^#/, ""));
        const normalizedTag = normalizeTagKey(tag);
        if (normalizedTerm && normalizedTerm !== normalizedTag) {
          return `入力「${escapeHtmlForMarkdown(first)}」は同義語として解釈され、<strong>${escapeHtmlForMarkdown(tag)}</strong>を自動表示しました。`;
        }
        return `入力に一致した<strong>${escapeHtmlForMarkdown(tag)}</strong>を自動表示しました。`;
      }

        } else if (title && typeof title.scrollIntoView === "function") {

      function syncSelectedTagToUrl(tag) {
        const normalizedTag = String(tag || "").trim();
        if (!normalizedTag) return;
        try {
          const url = new URL(window.location.href);
          const beforeUrl = `${url.pathname}${url.search}${url.hash}`;
          url.searchParams.set("tag", normalizedTag);
          const afterUrl = `${url.pathname}${url.search}${url.hash}`;
          if (afterUrl === beforeUrl) return;
          history.replaceState(null, "", afterUrl);
        } catch (_err) {
          // noop
        }
      }

	      async function searchTags(options = {}) {
	        const terms = getSearchTerms();
	        if (options.trackEvent !== false) {
	          trackAnalyticsEvent("search_submitted", {
	            surface: "tag_search",
	            props: {
	              term_count: terms.length,
	              has_query: terms.length > 0
	            }
	          });
	        }
	        let rows = [];
        if (!terms.length) {
          rows = state.tagCatalog
            .slice()
            .sort((a, b) => {
              const diffView = Number(b.view_count || 0) - Number(a.view_count || 0);
              if (diffView !== 0) return diffView;
              const diffRelated = Number(b.related_count || 0) - Number(a.related_count || 0);
              if (diffRelated !== 0) return diffRelated;
              return String(a.tag || "").localeCompare(String(b.tag || ""), "ja");
            })
            .slice(0, 400);
        } else {
          rows = state.tagCatalog
            .map((item) => ({ item, score: scoreTagItem(item, terms) }))
            .filter((row) => row.score >= 0)
            .sort((a, b) => {
              if (b.score !== a.score) return b.score - a.score;
              const diffView = Number(b.item.view_count || 0) - Number(a.item.view_count || 0);
              if (diffView !== 0) return diffView;
              const diffRelated = Number(b.item.related_count || 0) - Number(a.item.related_count || 0);
              if (diffRelated !== 0) return diffRelated;
              return String(a.item.tag || "").localeCompare(String(b.item.tag || ""), "ja");
            })
            .slice(0, 500)
            .map((row) => row.item);
        }
        renderSearchResults(rows, terms);
        const shouldAutoOpenSingle = options.autoOpenSingle !== false;
        if (shouldAutoOpenSingle && terms.length && rows.length === 1) {
          const tag = rows[0].tag;
          if (state.selectedTag !== tag) {
            await selectTag(tag, { fromSearch: true, searchTerms: terms, focusDetail: true });
          } else {
            focusDetailSection();
          }
        }
      }

	      function renderSearchResults(rows, terms) {
	        const list = document.getElementById("resultList");
	        const meta = document.getElementById("searchMeta");
	        if (!list || !meta) return;
	        const analyticsKey = `${(terms || []).join(" ")}|${rows.length}`;
	        if (state.lastAnalyticsSearchKey !== analyticsKey) {
	          state.lastAnalyticsSearchKey = analyticsKey;
	          trackAnalyticsEvent("results_rendered", {
	            surface: "tag_search",
	            props: {
	              result_count: rows.length,
	              term_count: Array.isArray(terms) ? terms.length : 0
	            }
	          });
	        }

	        if (!rows.length) {
          list.classList.remove("is-compact");
          list.innerHTML = "<div class='empty'>該当タグがありません。</div>";
          meta.textContent = terms.length
            ? `検索語 ${terms.length} 個 / 0 件`
            : "タグデータは読み込まれていますが表示対象がありません。";
          return;
        }

        if (terms.length && rows.length === 1) {
          list.classList.add("is-compact");
          list.innerHTML = `<div class='single-hit-note'>${describeSingleHit(terms, rows[0].tag)}</div>`;
          meta.textContent = `検索語 ${terms.length} 個 / 1 件（自動表示）`;
          return;
        }

        list.classList.remove("is-compact");

        meta.textContent = terms.length
          ? `検索語 ${terms.length} 個 / ${rows.length} 件`
          : `候補 ${rows.length} 件（複数候補）`;

        const frag = document.createDocumentFragment();
        rows.forEach((item) => {
          const btn = document.createElement("button");
          btn.className = "result-item" + (state.selectedTag === item.tag ? " active" : "");
          btn.type = "button";
          btn.dataset.tag = item.tag || "";
          btn.setAttribute("role", "option");
          btn.setAttribute("aria-selected", state.selectedTag === item.tag ? "true" : "false");
          btn.innerHTML =
            `<div class='result-item-title'>${escapeHtmlForMarkdown(item.tag || "")}</div>` +
            `<div class='result-item-meta'>関連問題 ${Number(item.related_count || 0)} / 閲覧 ${Number(item.view_count || 0)}</div>`;
          btn.addEventListener("click", () => {
            selectTag(item.tag, { focusDetail: true, fromSearch: true, searchTerms: getSearchTerms() });
          });
          frag.appendChild(btn);
        });
        list.innerHTML = "";
        list.appendChild(frag);
      }

      function nextRenderId(prefix) {
        state.renderSeq += 1;
        return `${prefix}-${state.renderSeq}`;
      }

      function renderTagMetaChips(label, items, onClick, collapseLimit) {
        const values = Array.isArray(items)
          ? items.map((item) => String(item || "").trim()).filter(Boolean)
          : [];
        if (!values.length) {

        }
        const limit = Number.isFinite(collapseLimit) && collapseLimit > 0 ? collapseLimit : 0;
        const shouldCollapse = limit > 0 && values.length > limit;
        const listId = nextRenderId("chiplist");
        const chips = values
          .map((item, idx) => {
            const safe = escapeHtmlForMarkdown(item);
            const extraClass = shouldCollapse && idx >= limit ? "chip-extra is-hidden" : "";
            if (onClick) {
              return `<button type='button' class='chip-button ${extraClass}' data-chip='${safe}'>${safe}</button>`;
            }
            return `<span class='chip ${extraClass}'>${safe}</span>`;
          })
          .join(" ");
        const expandBtn = shouldCollapse
          ? `<button type='button' class='expand-btn' data-expand-target='${listId}' data-open='0'>すべて表示 (${values.length})</button>`
          : "";
        return `<div><label>${label}</label><div id='${listId}' class='chip-list'>${chips}</div>${expandBtn}</div>`;
      }

      function rankLabelsByRelatedCount(labels, indexMap, relatedSerials) {
        const values = Array.isArray(labels)
          ? labels.map((item) => String(item || "").trim()).filter(Boolean)
          : [];
        if (!values.length) return [];
        const serialSet = new Set(
          Array.isArray(relatedSerials)
            ? relatedSerials.map((serial) => String(serial || "").trim()).filter(Boolean)
            : []
        );
        const uniq = Array.from(new Set(values));
        const scored = uniq.map((label) => {
          const serials = (indexMap && Array.isArray(indexMap[label])) ? indexMap[label] : [];
          let count = 0;
          if (serialSet.size && serials.length) {
            serials.forEach((serial) => {
              if (serialSet.has(serial)) count += 1;
            });
          }
          return { label, count };
        });
        scored.sort((a, b) => {
          if (b.count !== a.count) return b.count - a.count;
          return String(a.label).localeCompare(String(b.label), "ja");
        });
        return scored;
      }

      function buildSubjectPrefixedSubtopicRanks(subtopics, subjects, relatedSerials) {
        const subtopicRanks = rankLabelsByRelatedCount(subtopics, state.indexBySubtopic, relatedSerials);
        if (!subtopicRanks.length) return [];
        const subjectList = Array.isArray(subjects)
          ? subjects.map((item) => String(item || "").trim()).filter(Boolean)
          : [];
        if (!subjectList.length) return subtopicRanks;
        const serialSet = new Set(
          Array.isArray(relatedSerials)
            ? relatedSerials.map((serial) => String(serial || "").trim()).filter(Boolean)
            : []
        );
        const subjectSerialSets = {};
        subjectList.forEach((subject) => {
          subjectSerialSets[subject] = new Set(
            Array.isArray(state.indexBySubject[subject]) ? state.indexBySubject[subject] : []
          );
        });
        return subtopicRanks.map((row) => {
          const subtopic = row.label;
          const subtopicSerials = Array.isArray(state.indexBySubtopic[subtopic]) ? state.indexBySubtopic[subtopic] : [];
          let bestSubject = "";
          let bestScore = -1;
          subjectList.forEach((subject) => {
            const subjectSet = subjectSerialSets[subject];
            let score = 0;
            if (serialSet.size && subtopicSerials.length) {
              subtopicSerials.forEach((serial) => {
                if (serialSet.has(serial) && subjectSet.has(serial)) score += 1;
              });
            }
            if (
              score > bestScore ||
              (score === bestScore && bestSubject && String(subject).localeCompare(String(bestSubject), "ja") < 0) ||
              (score === bestScore && !bestSubject)
            ) {
              bestScore = score;
              bestSubject = subject;
            }
          });
          const label = bestSubject ? `${bestSubject}/${subtopic}` : subtopic;
          return { label, count: row.count };
        });
      }

      async function loadTagDeepDive(tag) {
        if (!window.AI_API_BASE || !tag) return { ok: false, found: false };
        const cache = state.tagDeepDiveCache[tag];
        if (cache) return { ok: true, found: true, data: cache };
        const resp = await fetch(`${window.AI_API_BASE}/ai/tag_deep_dive?tag=${encodeURIComponent(tag)}`);
        const payload = resp.ok ? await resp.json() : await resp.json().catch(() => ({}));
        if (!resp.ok) {
          return { ok: false, found: false, message: parseApiError(payload, `HTTP ${resp.status}`) };
        }
        if (!payload || !payload.found) return { ok: true, found: false };
        state.tagDeepDiveCache[tag] = payload.data;
        return { ok: true, found: true, data: payload.data };
      }

      async function generateTagDeepDive(tag, item, statusEl, bodyEl, generateBtn) {
        if (!window.AI_API_BASE) {
          statusEl.textContent = "AI_API_BASE が設定されていません。";
          statusEl.className = "status error";
          return { ok: false, request_id: "" };
        }
        if (!canUseAiGeneration()) {
          statusEl.textContent = "生成にはAI公開ONまたは管理者ログインが必要です。";
          statusEl.className = "status error";
          return { ok: false, request_id: "" };
        }

        statusEl.textContent = "生成中...";
        statusEl.className = "status";
        bodyEl.classList.add("loading");
        generateBtn.disabled = true;
        try {
          const token = await getAccessToken();
          const headers = { "Content-Type": "application/json" };
          if (token) headers.Authorization = `Bearer ${token}`;
          const resp = await fetch(`${window.AI_API_BASE}/ai/tag_deep_dive`, {
            method: "POST",
            headers,
            body: JSON.stringify({
              tag,
              description: item.description || "",
              canonical_tag: item.canonical_tag || tag,
              aliases: item.aliases || [],
              related_tags: item.related_tags || [],
              subjects: item.subjects || [],
              subtopics: item.subtopics || [],
              sample_serials: getRelatedSerialsForTag(tag).slice(0, 40),
              model: "gemini-3-flash-preview"
            })
          });
          const payload = await resp.json().catch(() => ({}));
          if (!resp.ok) {
            statusEl.textContent = `生成に失敗: ${parseApiError(payload, `HTTP ${resp.status}`)}`;
            statusEl.className = "status error";
            return { ok: false, request_id: payload && payload.request_id ? String(payload.request_id) : "" };
          }
          const explanation = String(payload.explanation || payload.text || "").trim();
          if (!explanation) {
            statusEl.textContent = "生成結果が空でした。";
            statusEl.className = "status error";
            return { ok: false, request_id: payload && payload.request_id ? String(payload.request_id) : "" };
          }
          trackAnalyticsEvent("ai_generate_completed", {
            surface: "tag_deep_dive",
            entity_type: "tag",
            entity_id: tag,
            request_id: payload && payload.request_id ? payload.request_id : "",
            props: { feature: "tag_deep_dive" }
          });
          state.tagDeepDiveCache[tag] = {
            tag,
            explanation,
            updated_at: payload.updated_at || new Date().toISOString(),
            request_id: payload && payload.request_id ? String(payload.request_id) : ""
          };
          renderMarkdownToElement(bodyEl, explanation);
          statusEl.textContent = "生成完了";
          statusEl.className = "status";
          return {
            ok: true,
            request_id: payload && payload.request_id ? String(payload.request_id) : "",
            explanation
          };
        } catch (err) {
          statusEl.textContent = `生成に失敗: ${String(err.message || err)}`;
          statusEl.className = "status error";
          return { ok: false, request_id: "" };
        } finally {
          bodyEl.classList.remove("loading");
          generateBtn.disabled = false;
        }
      }

	              entity_type: "tag_qa",
	              entity_id: entityId,
	              props: { feature: "tag_qa", rating: "helpful" }
	            });
	            if (item.id) {
	              await postTagQaCounter("/ai/tag_qa/like", item.id);
	            }
	          });

          const answer = document.createElement("div");
          answer.className = "qa-answer";
          answer.hidden = true;
          renderMarkdownToElement(answer, item.answer || "");

	          qBtn.addEventListener("click", async () => {
	            answer.hidden = !answer.hidden;
	            const viewKey = makeTagQaViewKey(item);
	            if (!item.id || state.qaViewed.has(viewKey)) return;
	            state.qaViewed.add(viewKey);
	            viewCount += 1;
	            viewEl.textContent = `閲覧 ${viewCount}`;
	            trackAnalyticsEvent("tag_qa_viewed", {
	              surface: "tag_qa",
	              entity_type: "tag_qa",
	              entity_id: item.id ? String(item.id) : viewKey,
	              props: { tag }
	            });
	            await postTagQaCounter("/ai/tag_qa/view", item.id);
	          });

          meta.appendChild(likeBtn);
          meta.appendChild(viewEl);
          wrap.appendChild(qBtn);
          wrap.appendChild(meta);
          wrap.appendChild(answer);
          listEl.appendChild(wrap);
        });
      }

      async function generateTagQa(tag, item, question, statusEl, listEl) {
        if (!window.AI_API_BASE) {
          statusEl.textContent = "AI_API_BASE が設定されていません。";
          statusEl.className = "status error";
          return;
        }
        if (!canUseAiGeneration()) {
          statusEl.textContent = "生成にはAI公開ONまたは管理者ログインが必要です。";
          statusEl.className = "status error";
          return;
        }
        if (!question.trim()) {
          statusEl.textContent = "質問を入力してください。";
          statusEl.className = "status error";
          return;
        }

        statusEl.textContent = "生成中...";
        statusEl.className = "status";
        try {
          const token = await getAccessToken();
          const headers = { "Content-Type": "application/json" };
          if (token) headers.Authorization = `Bearer ${token}`;
          const resp = await fetch(`${window.AI_API_BASE}/ai/tag_qa`, {
            method: "POST",
            headers,
            body: JSON.stringify({
              tag,
              question,
              description: item.description || "",
              aliases: item.aliases || [],
              related_tags: item.related_tags || [],
              subjects: item.subjects || [],
              subtopics: item.subtopics || [],
              sample_serials: getRelatedSerialsForTag(tag).slice(0, 20),
              model: "gemini-3-flash-preview"
            })
          });
          const payload = await resp.json().catch(() => ({}));
          if (!resp.ok) {
            statusEl.textContent = `生成に失敗: ${parseApiError(payload, `HTTP ${resp.status}`)}`;
            statusEl.className = "status error";
            return;
          }
	          if (payload.status === "irrelevant") {
	            trackAnalyticsEvent("ai_generate_completed", {
	              surface: "tag_qa",
	              entity_type: "tag",
	              entity_id: tag,
	              request_id: payload && payload.request_id ? payload.request_id : "",
	              props: { feature: "tag_qa", status: "irrelevant" }
	            });
	            statusEl.textContent = "質問がタグ学習と無関係と判定されました。";
	            statusEl.className = "status error";
	            return;
	          }
	          trackAnalyticsEvent("ai_generate_completed", {
	            surface: "tag_qa",
	            entity_type: "tag",
	            entity_id: tag,
	            request_id: payload && payload.request_id ? payload.request_id : "",
	            props: { feature: "tag_qa", status: "ok" }
	          });
	          statusEl.textContent = "生成完了";
          statusEl.className = "status";
          const qa = await loadTagQa(tag);
          if (qa.ok) {
            renderTagQaList(tag, qa.items, listEl, statusEl);
            statusEl.textContent = `Q&A: ${qa.items.length}件（最新を反映）`;
          }
        } catch (err) {
          statusEl.textContent = `生成に失敗: ${String(err.message || err)}`;
          statusEl.className = "status error";
        }
      }

      function attachMetaChipHandlers(root) {
        root.querySelectorAll("button[data-chip]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const value = btn.getAttribute("data-chip") || "";
            const input = document.getElementById("tagSearchInput");
            if (!input) return;
            input.value = value;
            searchTags();
          });
        });
      }

      function attachExpandHandlers(root) {
        root.querySelectorAll("button[data-expand-target]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const targetId = btn.getAttribute("data-expand-target");
            if (!targetId) return;
            const list = root.querySelector(`#${targetId}`);
            if (!list) return;
            const isOpen = btn.getAttribute("data-open") === "1";
            list.querySelectorAll(".chip-extra").forEach((el) => {
              el.classList.toggle("is-hidden", isOpen);
            });
            if (isOpen) {
              btn.setAttribute("data-open", "0");
              const size = Number(btn.getAttribute("data-total") || list.querySelectorAll(".chip-button,.chip").length || 0);
              btn.textContent = `すべて表示 (${size})`;
            } else {
              btn.setAttribute("data-open", "1");
              btn.textContent = "省略表示";
            }
          });
        });
      }

	      async function selectTag(tag, options = {}) {
	        if (!tag || !state.tagCatalogByTag[tag]) return;
	        const prevTag = state.selectedTag;
	        state.selectedTag = tag;
	        if (prevTag !== tag) {
	          trackAnalyticsEvent("tag_viewed", {
	            surface: "tag_detail",
	            entity_type: "tag",
	            entity_id: tag,
	            props: { from_search: Boolean(options.fromSearch) }
	          });
	        }
	        syncSelectedTagToUrl(tag);
        if (options.refreshSearchList) {
	        await searchTags({ autoOpenSingle: false, trackEvent: false });
        } else {
          const resultList = document.getElementById("resultList");
          if (resultList) {
            resultList.querySelectorAll(".result-item").forEach((btn) => {
              const active = (btn.dataset.tag || "") === tag;
              btn.classList.toggle("active", active);
              btn.setAttribute("aria-selected", active ? "true" : "false");
            });
          }
        }
        const item = state.tagCatalogByTag[tag];
        const relatedSerials = getRelatedSerialsForTag(tag);
        const rankedSubjects = rankLabelsByRelatedCount(item.subjects || [], state.indexBySubject, relatedSerials);
        const rankedSubtopics = buildSubjectPrefixedSubtopicRanks(
          item.subtopics || [],
          rankedSubjects.map((row) => row.label),
          relatedSerials
        );
        const detailTitle = document.getElementById("detailTitle");
        const detailHint = document.getElementById("detailHint");
        const detailBody = document.getElementById("detailBody");
        if (!detailBody || !detailTitle || !detailHint) return;
        detailTitle.textContent = `タグ詳細: ${tag}`;
        if (options.fromSearch && Array.isArray(options.searchTerms) && options.searchTerms.length) {
          detailHint.textContent = `検索入力: ${options.searchTerms.join(" ")} / 表示中: ${tag}`;
        } else {
          detailHint.textContent = "タグ説明・関連問題・AI深掘り・Q&A";
        }

        const equivalents = getEquivalentTagsForTerm(tag).filter((v) => v !== tag);
        detailBody.innerHTML = `
          <h3 class='tag-title'>${escapeHtmlForMarkdown(tag)}</h3>
          <div class='tag-meta'>関連問題 ${Number(item.related_count || 0)}件 / 閲覧 ${Number(item.view_count || 0)}</div>

          <section class='section'>
            <h3>タグ説明</h3>
            <div class='section-body'>
              <div id='tagDescription' class='tag-description'></div>
              <div class='btn-row' style='margin-top:10px;'>
                <button type='button' id='tagDeepDiveLoadBtn'>深掘りを表示</button>
                <button type='button' id='tagDeepDiveGenerateBtn' class='btn-accent'>深掘りを生成</button>
                <button type='button' id='tagQaReloadBtn'>Q&Aを表示</button>
                <button type='button' id='tagQaGenerateBtn' class='btn-accent'>Q&Aを生成</button>
              </div>
              <textarea id='tagQaInput' style='margin-top:8px;' placeholder='このタグについて質問を入力（例: 病態との関連を教えて）'></textarea>
              <div id='tagDeepDiveStatus' class='status'></div>
              <div id='tagDeepDiveBody' class='tag-description'></div>
              <div id='tagDeepDiveFeedback' class='qa-meta'>
                <button type='button' id='tagDeepDiveHelpfulBtn'>👍 役に立った</button>
                <button type='button' id='tagDeepDiveNotHelpfulBtn'>👎 改善要望</button>
              </div>
              <div id='tagQaStatus' class='status'></div>
              <div id='tagQaList'></div>
            </div>
          </section>

          <section class='section'>
            <h3>タグ情報</h3>
            <div class='section-body'>
              ${renderTagMetaChips("同義語(結合)", equivalents, true)}
              ${renderTagMetaChips("別名", item.aliases || [], true)}
              ${renderTagMetaChips("関連タグ", item.related_tags || [], true)}
              ${renderRankedMetaChips("科目", rankedSubjects, 3)}
              ${renderRankedMetaChips("小項目", rankedSubtopics, 3)}
            </div>
          </section>

          <section class='section'>
            <h3>関連問題</h3>
            <div class='section-body' id='relatedSerialsBox'>${renderRelatedSerials(tag)}</div>
          </section>
        `;

        const tagDescription = document.getElementById("tagDescription");
        renderMarkdownToElement(
          tagDescription,
          (item.description || "").trim() || "このタグの説明は未登録です。"
        );
        if (options.focusDetail) {
          focusDetailSection(options.focusTarget);
        }

        attachMetaChipHandlers(detailBody);
        attachExpandHandlers(detailBody);

        const deepDiveStatus = document.getElementById("tagDeepDiveStatus");
        const deepDiveBody = document.getElementById("tagDeepDiveBody");
        const deepDiveHelpfulBtn = document.getElementById("tagDeepDiveHelpfulBtn");
        const deepDiveNotHelpfulBtn = document.getElementById("tagDeepDiveNotHelpfulBtn");
        const loadBtn = document.getElementById("tagDeepDiveLoadBtn");
        const generateBtn = document.getElementById("tagDeepDiveGenerateBtn");
        const deepDiveRatingKey = getTagDeepDiveRatingKey(tag);
        let deepDiveAvailable = false;
        let deepDiveRequestId = "";
        const updateDeepDiveRatingButtons = () => {
          const rating = (deepDiveRatingKey && state.tagDeepDiveRatings[deepDiveRatingKey]) || "";
          const helpfulChecked = rating === "helpful" ? " ✓" : "";
          const notHelpfulChecked = rating === "not_helpful" ? " ✓" : "";
          deepDiveHelpfulBtn.textContent = `👍 役に立った${helpfulChecked}`;
          deepDiveNotHelpfulBtn.textContent = `👎 改善要望${notHelpfulChecked}`;
          const locked = Boolean(rating) || !deepDiveAvailable;
          deepDiveHelpfulBtn.disabled = locked;
          deepDiveNotHelpfulBtn.disabled = locked;
        };

        deepDiveHelpfulBtn.addEventListener("click", () => {
          if (!deepDiveRatingKey || !deepDiveAvailable || state.tagDeepDiveRatings[deepDiveRatingKey]) return;
          state.tagDeepDiveRatings[deepDiveRatingKey] = "helpful";
          saveTagDeepDiveRatingState();
          updateDeepDiveRatingButtons();
          submitAiFeedbackEvent({
            feature: "tag_deep_dive",
            rating: "helpful",
            request_id: deepDiveRequestId,
            entity_type: "tag_deep_dive",
            entity_id: tag
          });
          trackAnalyticsEvent("ai_feedback_submitted", {
            surface: "tag_deep_dive",
            entity_type: "tag_deep_dive",
            entity_id: tag,
            request_id: deepDiveRequestId,
            props: { feature: "tag_deep_dive", rating: "helpful" }
          });
        });

        deepDiveNotHelpfulBtn.addEventListener("click", () => {
          if (!deepDiveRatingKey || !deepDiveAvailable || state.tagDeepDiveRatings[deepDiveRatingKey]) return;
          state.tagDeepDiveRatings[deepDiveRatingKey] = "not_helpful";
          saveTagDeepDiveRatingState();
          updateDeepDiveRatingButtons();
          submitAiFeedbackEvent({
            feature: "tag_deep_dive",
            rating: "not_helpful",
            request_id: deepDiveRequestId,
            entity_type: "tag_deep_dive",
            entity_id: tag
          });
          trackAnalyticsEvent("ai_feedback_submitted", {
            surface: "tag_deep_dive",
            entity_type: "tag_deep_dive",
            entity_id: tag,
            request_id: deepDiveRequestId,
            props: { feature: "tag_deep_dive", rating: "not_helpful" }
          });
        });
        updateDeepDiveRatingButtons();

        if (!window.AI_API_BASE) {
          deepDiveStatus.textContent = "AI_API_BASE が設定されていません。";
          deepDiveStatus.className = "status error";
          loadBtn.disabled = true;
          generateBtn.disabled = true;
          deepDiveAvailable = false;
          deepDiveRequestId = "";
          updateDeepDiveRatingButtons();
        } else {
          const deepDiveLoaded = await loadTagDeepDive(tag);
          if (state.selectedTag !== tag) return;
          if (deepDiveLoaded.ok && deepDiveLoaded.found) {
            renderMarkdownToElement(deepDiveBody, deepDiveLoaded.data.explanation || "");
            deepDiveStatus.textContent = `保存済み（更新: ${deepDiveLoaded.data.updated_at || "-"}）`;
            deepDiveStatus.className = "status";
            deepDiveAvailable = Boolean(String(deepDiveLoaded.data.explanation || "").trim());
            deepDiveRequestId = deepDiveLoaded.data.request_id ? String(deepDiveLoaded.data.request_id) : "";
          } else if (!deepDiveLoaded.ok) {
            deepDiveStatus.textContent = deepDiveLoaded.message || "読み込みに失敗しました。";
            deepDiveStatus.className = "status error";
            deepDiveAvailable = false;
            deepDiveRequestId = "";
          } else {
            deepDiveStatus.textContent = "保存済みの深掘り解説はありません。";
            deepDiveStatus.className = "status";
            deepDiveBody.innerHTML = "";
            deepDiveAvailable = false;
            deepDiveRequestId = "";
          }
          updateDeepDiveRatingButtons();
        }

        loadBtn.addEventListener("click", async () => {
          deepDiveStatus.textContent = "読み込み中...";
          deepDiveStatus.className = "status";
          const res = await loadTagDeepDive(tag);
          if (state.selectedTag !== tag) return;
          if (!res.ok) {
            deepDiveStatus.textContent = res.message || "読み込みに失敗しました。";
            deepDiveStatus.className = "status error";
            deepDiveAvailable = false;
            deepDiveRequestId = "";
            updateDeepDiveRatingButtons();
            return;
          }
          if (!res.found) {
            deepDiveStatus.textContent = "保存済みの深掘り解説はありません。";
            deepDiveStatus.className = "status";
            deepDiveBody.innerHTML = "";
            deepDiveAvailable = false;
            deepDiveRequestId = "";
            updateDeepDiveRatingButtons();
            return;
          }
          renderMarkdownToElement(deepDiveBody, res.data.explanation || "");
          deepDiveStatus.textContent = `保存済み（更新: ${res.data.updated_at || "-"}）`;
          deepDiveStatus.className = "status";
          deepDiveAvailable = Boolean(String(res.data.explanation || "").trim());
          deepDiveRequestId = res.data.request_id ? String(res.data.request_id) : "";
          updateDeepDiveRatingButtons();
        });

        generateBtn.addEventListener("click", async () => {
          const generated = await generateTagDeepDive(tag, item, deepDiveStatus, deepDiveBody, generateBtn);
          if (state.selectedTag !== tag) return;
          if (generated && generated.ok) {
            deepDiveAvailable = true;
            deepDiveRequestId = generated.request_id ? String(generated.request_id) : "";
          } else if (!deepDiveAvailable) {
            deepDiveRequestId = generated && generated.request_id ? String(generated.request_id) : "";
          }
          updateDeepDiveRatingButtons();
        });

        const qaStatus = document.getElementById("tagQaStatus");
        const qaList = document.getElementById("tagQaList");
        const qaInput = document.getElementById("tagQaInput");
        const qaGenerateBtn = document.getElementById("tagQaGenerateBtn");
        const qaReloadBtn = document.getElementById("tagQaReloadBtn");

        async function reloadQa() {
          qaStatus.textContent = "Q&A読み込み中...";
          qaStatus.className = "status";
          const qa = await loadTagQa(tag);
          if (state.selectedTag !== tag) return;
          if (!qa.ok) {
            qaStatus.textContent = qa.message || "Q&A読み込みに失敗しました。";
            qaStatus.className = "status error";
            return;
          }
          renderTagQaList(tag, qa.items, qaList, qaStatus);
        }

        if (!window.AI_API_BASE) {
          qaStatus.textContent = "AI_API_BASE が設定されていません。";
          qaStatus.className = "status error";
          qaGenerateBtn.disabled = true;
          qaReloadBtn.disabled = true;
        } else {
          reloadQa();
        }

        qaReloadBtn.addEventListener("click", () => {
          reloadQa();
        });

        qaGenerateBtn.addEventListener("click", async () => {
          const text = qaInput.value.trim();
          if (!text) {
            qaStatus.textContent = "質問を入力してください。";
            qaStatus.className = "status error";
            return;
          }
          qaGenerateBtn.disabled = true;
          await generateTagQa(tag, item, text, qaStatus, qaList);
          qaGenerateBtn.disabled = false;
          if (qaStatus.className !== "status error") {
            qaInput.value = "";
          }
        });
      }

      async function loadData() {
        const [tagCatalog, indexByTag, indexBySubject, indexBySubtopic] = await Promise.all([
          fetch("../output/web/index/tag_catalog.json").then((r) => (r.ok ? r.json() : [])),
          fetch("../output/web/index/index_by_tag.json").then((r) => (r.ok ? r.json() : {})),
          fetch("../output/web/index/index_by_subject.json").then((r) => (r.ok ? r.json() : {})),
          fetch("../output/web/index/index_by_subtopic.json").then((r) => (r.ok ? r.json() : {})),
        ]);

        state.tagCatalog = Array.isArray(tagCatalog) ? tagCatalog : [];
        state.indexByTag = indexByTag || {};
        state.indexBySubject = indexBySubject || {};
        state.indexBySubtopic = indexBySubtopic || {};
        state.tagCatalogByTag = {};
        state.tagCatalog.forEach((item) => {
          const tag = item && item.tag ? String(item.tag).trim() : "";
          if (!tag) return;
          state.tagCatalogByTag[tag] = item;
        });
        state.tagEquivalentByNormalized = buildTagEquivalentMap();
      }

      function initAuthUi() {
        const refreshBtn = document.getElementById("authRefreshBtn");
        const signInBtn = document.getElementById("authSignInBtn");
        const signOutBtn = document.getElementById("authSignOutBtn");
        const emailInput = document.getElementById("authEmail");
        const passwordInput = document.getElementById("authPassword");

        if (!supabaseClient) {
          if (signInBtn) signInBtn.disabled = true;
          if (signOutBtn) signOutBtn.disabled = true;
          if (refreshBtn) refreshBtn.disabled = true;
          return;
        }

        supabaseClient.auth.onAuthStateChange(async (_event, session) => {
          state.authSession = session || null;
          const role = session && session.user ? getUserRole(session.user) : "";
          state.roleRank = roleRank(role);
          renderAuthStatus();
          loadTagDeepDiveRatingState();
          if (state.selectedTag && state.tagCatalogByTag[state.selectedTag]) {
            selectTag(state.selectedTag).catch(() => {});
          }
        });

        refreshBtn.addEventListener("click", async () => {
          await loadAiConfig();
          await loadAuthState();
        });

        signInBtn.addEventListener("click", async () => {
          const email = String(emailInput.value || "").trim();
          const password = String(passwordInput.value || "");
          if (!email || !password) {
            renderAuthStatus("メールアドレスとパスワードを入力してください。");
            return;
          }
          signInBtn.disabled = true;
          try {
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
              renderAuthStatus(`ログイン失敗: ${error.message}`);
              return;
            }
            await loadAuthState();
            renderAuthStatus("ログインしました。");
          } catch (err) {
            renderAuthStatus(`ログイン失敗: ${String(err.message || err)}`);
          } finally {
            signInBtn.disabled = false;
          }
        });

        signOutBtn.addEventListener("click", async () => {
          signOutBtn.disabled = true;
          try {
            await supabaseClient.auth.signOut();
            await loadAuthState();
            renderAuthStatus("ログアウトしました。");
          } catch (err) {
            renderAuthStatus(`ログアウト失敗: ${String(err.message || err)}`);
          } finally {
            signOutBtn.disabled = false;
          }
        });
      }

      function initSearchUi() {
        const input = document.getElementById("tagSearchInput");
        const searchBtn = document.getElementById("tagSearchBtn");
        const clearBtn = document.getElementById("tagSearchClearBtn");
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            searchTags();
          }
        });
        searchBtn.addEventListener("click", () => {
          searchTags();
        });
        clearBtn.addEventListener("click", () => {
          input.value = "";
          searchTags();
        });
      }

      function initMenuBar() {
        const menuToggleBtn = document.getElementById("menuToggleBtn");
        const topPanels = document.getElementById("topPanels");
        const authPanel = document.getElementById("authPanel");
        const authPanelToggle = document.getElementById("authPanelToggle");
        if (menuToggleBtn && topPanels) {
          menuToggleBtn.addEventListener("click", () => {
            const nextOpen = topPanels.hidden;
            topPanels.hidden = !nextOpen;
            menuToggleBtn.setAttribute("aria-expanded", nextOpen ? "true" : "false");
            if (!nextOpen && authPanel) {
              authPanel.hidden = true;
            }
          });
        }
        if (authPanel && authPanelToggle) {
          authPanelToggle.addEventListener("click", () => {
            authPanel.hidden = !authPanel.hidden;
          });
        }
      }

      async function init() {
        initMenuBar();
        initAuthUi();
        initSearchUi();
        await Promise.all([loadData(), loadAiConfig(), loadAuthState()]);
        renderAuthStatus();
        await searchTags({ autoOpenSingle: false });

        const initialTag = (new URL(window.location.href).searchParams.get("tag") || "").trim();
        if (initialTag && state.tagCatalogByTag[initialTag]) {
          selectTag(initialTag, { focusDetail: true, focusTarget: "header" });
          return;
        }
        if (state.tagCatalog.length) {
          selectTag(state.tagCatalog[0].tag);
        }
      }

      init().catch((err) => {
        const body = document.getElementById("detailBody");
        if (body) {
          body.innerHTML = `<div class='empty'>初期化に失敗しました: ${escapeHtmlForMarkdown(String(err.message || err))}</div>`;
        }
      });
    </script>
  </body>
</html>
